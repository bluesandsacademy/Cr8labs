<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ojuju:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face {
      font-family: 'Switzer';
      src: url(data:font/woff2;base64,__SWITZER_400_B64__) format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Switzer';
      src: url(data:font/woff2;base64,__SWITZER_500_B64__) format('woff2');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Switzer';
      src: url(data:font/woff2;base64,__SWITZER_600_B64__) format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { text-decoration: none; }

    .nf-root { width: 1440px; height: 900px; background: radial-gradient(circle at 62% 38%, #322C7D 0%, #211D54 42%, #14113A 100%); font-family: 'Switzer', sans-serif; color: #F3ECDE; position: relative; overflow: hidden; display: flex; flex-direction: column; }

    .nf-grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; z-index: 6; }

    .nf-nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 64px; position: relative; z-index: 5; }
    .nf-brand { display: flex; align-items: center; gap: 11px; }
    .nf-brand img { height: 26px; width: auto; filter: brightness(0) invert(1); opacity: 0.92; }
    .nf-wordmark { font-family: 'Ojuju', sans-serif; font-weight: 700; font-size: 21px; color: #F3ECDE; }
    .nf-navcta { font-family: 'Switzer', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; background: #F3ECDE; color: #17130F; padding: 11px 20px; border-radius: 3px; transition: opacity .15s; }
    .nf-navcta:hover { opacity: 0.85; }

    .nf-main { flex: 1; display: flex; align-items: center; position: relative; padding-left: 128px; }

    /* debris field: fragments of the mark's own rings, scattered and drifting rather than one tidy centered graphic */
    .nf-debris { position: absolute; inset: 0; z-index: 1; }
    .nf-debris svg { position: absolute; }
    .d1 { width: 620px; height: 620px; top: -140px; right: -80px; opacity: 0.5; }
    .d2 { width: 320px; height: 320px; bottom: -60px; right: 260px; opacity: 0.65; }
    .d3 { width: 180px; height: 180px; top: 90px; right: 560px; opacity: 0.8; }
    .d4 { width: 70px; height: 70px; bottom: 140px; right: 120px; opacity: 0.9; }
    .d5 { width: 34px; height: 34px; top: 220px; right: 760px; opacity: 0.7; }

    .nf-glow { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(245,166,35,0.22) 0%, rgba(245,166,35,0) 62%); z-index: 1; pointer-events: none; }

    .nf-content { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 20px; max-width: 560px; }
    .nf-eyebrow { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #A39CC9; }
    .nf-h1 { font-family: 'Ojuju', sans-serif; font-weight: 800; font-size: 92px; line-height: 0.94; letter-spacing: -0.02em; margin: 0; }
    .nf-h1 .dim { color: #8F87CF; }
    .nf-sub { font-size: 19px; color: #B9B2A4; margin: 0; }
    .nf-body { font-size: 16px; line-height: 1.6; color: #B9B2A4; margin: 0; max-width: 420px; }
    .nf-ctas { display: flex; gap: 14px; margin-top: 6px; }
    .nf-btn-primary { font-family: 'Switzer', sans-serif; font-weight: 600; font-size: 15px; background: #F5A623; color: #17130F; padding: 15px 26px; border-radius: 3px; box-shadow: 0 12px 26px -12px rgba(245,166,35,0.5); transition: transform .15s; }
    .nf-btn-primary:hover { transform: translateY(-1px); }
    .nf-btn-ghost { font-family: 'Switzer', sans-serif; font-weight: 600; font-size: 15px; background: transparent; border: 1.5px solid #F3ECDE; color: #F3ECDE; padding: 13.5px 26px; border-radius: 3px; transition: opacity .15s; }
    .nf-btn-ghost:hover { opacity: 0.8; }
  </style>
</helmet>

<div class="nf-root">

  <svg class="nf-grain" width="100%" height="100%">
    <filter id="nf-noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#nf-noise)"/>
  </svg>

  <nav class="nf-nav">
    <div class="nf-brand">
      <img src="cr8lab-icon.png" alt="CR8LAB mark">
      <div class="nf-wordmark">CR8LAB</div>
    </div>
    <a class="nf-navcta" href="#">Book a demo</a>
  </nav>

  <div class="nf-main">

    <div class="nf-glow"></div>

    <div class="nf-debris">
      <svg class="d1" viewBox="0 0 620 620" fill="none"><circle cx="310" cy="310" r="290" stroke="#4A4494" stroke-width="2" stroke-dasharray="22 16" transform="rotate(-12 310 310)"/></svg>
      <svg class="d2" viewBox="0 0 320 320" fill="none"><circle cx="160" cy="160" r="145" stroke="#8F87CF" stroke-width="2.5" stroke-dasharray="14 12" transform="rotate(30 160 160)"/></svg>
      <svg class="d3" viewBox="0 0 180 180" fill="none"><circle cx="90" cy="90" r="78" stroke="#F5A623" stroke-width="3" stroke-dasharray="8 9" transform="rotate(60 90 90)"/></svg>
      <svg class="d4" viewBox="0 0 70 70" fill="none"><circle cx="35" cy="35" r="28" stroke="#F3ECDE" stroke-width="2.5" stroke-dasharray="5 6"/></svg>
      <svg class="d5" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="13" stroke="#A39CC9" stroke-width="2" stroke-dasharray="3 5"/></svg>
    </div>

    <div class="nf-content">
      <p class="nf-eyebrow">Error 404</p>
      <h1 class="nf-h1">Nothing<br>here<span class="dim">.</span></h1>
      <p class="nf-sub">Not even in three dimensions.</p>
      <p class="nf-body">Try the work, or tell us what you were looking for.</p>
      <div class="nf-ctas">
        <a class="nf-btn-primary" href="#">See the work</a>
        <a class="nf-btn-ghost" href="#">Get in touch</a>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
